<section class="hero" [style.min-height]="minHeight">
  <div class="hero__background" [style.background-image]="backgroundImage ? 'url(' + backgroundImage + ')' : ''">
    <div class="hero__pattern"></div>
    <div *ngIf="overlay" class="hero__overlay"></div>
  </div>

  <div class="hero__content">
    <div class="container">
      <div class="hero__text">
        <h1 class="hero__title animate-on-scroll">{{ title }}</h1>
        <p class="hero__subtitle animate-on-scroll">{{ subtitle }}</p>

        <div *ngIf="showCTA" class="hero__buttons animate-on-scroll">
          <a routerLink="/contact" class="btn btn--accent btn--large">
            <span class="material-icons">request_quote</span>
            Request a Quote
          </a>
          <a routerLink="/capabilities" class="btn btn--secondary btn--large">
            <span class="material-icons">explore</span>
            Explore Our Capabilities
          </a>
        </div>
      </div>

      <div class="hero__features animate-on-scroll">
        <div class="hero__feature">
          <span class="material-icons">precision_manufacturing</span>
          <span>CNC/VMC Machining</span>
        </div>
        <div class="hero__feature">
          <span class="material-icons">build</span>
          <span>Tool Room</span>
        </div>
        <div class="hero__feature">
          <span class="material-icons">architecture</span>
          <span>Engineering Design</span>
        </div>
        <div class="hero__feature">
          <span class="material-icons">verified</span>
          <span>Quality Assured</span>
        </div>
      </div>
    </div>
  </div>

  <div class="hero__scroll-indicator">
    <span class="material-icons">expand_more</span>
  </div>
</section>
