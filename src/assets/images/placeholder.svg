<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2a6c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1a4a;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <circle cx="400" cy="300" r="120" fill="none" stroke="#ff6b35" stroke-width="3" opacity="0.5"/>
  <circle cx="400" cy="300" r="90" fill="none" stroke="#ff6b35" stroke-width="2" opacity="0.3"/>
  <text x="400" y="285" font-family="Inter, Arial, sans-serif" font-size="60" font-weight="700" fill="white" text-anchor="middle">IT</text>
  <text x="400" y="330" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="4">IMPACT TECH TOOL</text>
  <text x="400" y="360" font-family="Inter, Arial, sans-serif" font-size="12" fill="#ff6b35" text-anchor="middle" letter-spacing="2">PRECISION ENGINEERING</text>
</svg>
